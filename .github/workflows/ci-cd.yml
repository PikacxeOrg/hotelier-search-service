name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  CONFIGURATION: Release
  REGISTRY: docker.io
  IMAGE_NAME: hotelier-search-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.4
        with:
          versionSpec: '6.x'
          preferLatestVersion: true

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.0.4
        with:
          useConfigFile: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/SearchService.Tests/SearchService.Tests.csproj

      - name: Build
        run: dotnet build tests/SearchService.Tests/SearchService.Tests.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: |
          dotnet test tests/SearchService.Tests/SearchService.Tests.csproj \
            -c ${{ env.CONFIGURATION }} --no-build \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./coverage

  docker-build-push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.4
        with:
          versionSpec: '6.x'
          preferLatestVersion: true

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.0.4
        with:
          useConfigFile: true

      - name: Write Kaniko docker config
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.kaniko"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ secrets.DOCKERHUB_USERNAME }}' '${{ secrets.DOCKERHUB_TOKEN }}' | base64 -w0)" \
            > "${GITHUB_WORKSPACE}/.kaniko/config.json"

      - name: Build and push
        uses: docker://gcr.io/kaniko-project/executor:v1.23.0
        env:
          DOCKER_CONFIG: /github/workspace/.kaniko
        with:
          args: >-
            --dockerfile=/github/workspace/Dockerfile
            --context=dir:///github/workspace
            --destination=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.semVer }}
            ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && format('--destination={0}/{1}:latest', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
            --build-arg=VERSION=${{ steps.gitversion.outputs.semVer }}
            --cache=true
            --cache-repo=${{ secrets.DOCKERHUB_USERNAME }}/kaniko-cache
